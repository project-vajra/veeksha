
[tool.isort]
profile = "black"
known_first_party = "veeksha"
known_third_party = "wandb"

[tool.pyright]
include = ["veeksha", "test"]
exclude = [
    "**/__pycache__",
]
reportMissingImports = false

[build-system]
requires = [
    "packaging",
    "setuptools>=61",
    "setuptools-scm>=8.0",
    "jinja2",
    "lm_eval",
]
build-backend = "setuptools.build_meta"