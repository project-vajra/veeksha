seed: 42
output_dir: benchmark_output/tts_elevenlabs

client:
  type: tts
  provider: elevenlabs
  api_base: "https://api.elevenlabs.io/v1/text-to-speech/"
  # api_key reads from ELEVENLABS_API_KEY env var
  model: eleven_turbo_v2_5
  voice_id: JBFqnCBsd6RMkjVDRZzb
  sample_rate: 24000
  chunk_size: 1024
  raw_pcm: true
  save_audio: false
  request_timeout: 30

session_generator:
  type: synthetic
  session_graph:
    type: single_request
  channels:
    - type: text
      body_length_generator:
        type: fixed
        value: 20
  output_spec:
    text:
      output_length_generator:
        type: fixed
        value: 1

traffic_scheduler:
  type: concurrent
  target_concurrent_sessions: 1
  rampup_seconds: 0

evaluators:
  - type: performance
    target_channels: ["audio"]
    audio_channel:
      save_audio_files: false
    stream_metrics: true
    stream_metrics_interval: 5.0
    slos:
      - name: "P99 TTFA under 500ms"
        metric: ttfa_ms
        percentile: 0.99
        value: 500
        type: constant
      - name: "P90 Total Latency under 2s"
        metric: total_latency_ms
        percentile: 0.90
        value: 2000
        type: constant

runtime:
  max_sessions: 100
  benchmark_timeout: 600
  num_client_threads: 1
  num_dispatcher_threads: 1
  num_completion_threads: 1

trace_recorder:
  enabled: false
