seed: 42
output_dir: benchmark_output/tts_deepgram

client:
  type: tts
  provider: deepgram
  api_base: "https://api.deepgram.com/v1/speak"
  api_key: "9937cbe4aca4eb1c337c07fdb7281b1304ab5bbf"
  model: aura-2-thalia-en
  sample_rate: 24000
  chunk_size: 1024
  raw_pcm: false
  save_audio: true
  request_timeout: 90

session_generator:
  type: trace
  trace_file: traces/sharegpt_data.json
  wrap_mode: true
  flavor:
    type: sharegpt
    assistant_role: gpt
    min_tokens: 20
    max_tokens: 150

traffic_scheduler:
  type: concurrent
  target_concurrent_sessions: 1
  rampup_seconds: 0

evaluators:
  - type: performance
    target_channels: ["audio"]
    audio_channel:
      save_audio_files: true
    stream_metrics: true
    stream_metrics_interval: 5.0
    slos:
      - name: "P99 TTFA under 500ms"
        metric: ttfa_ms
        percentile: 0.99
        value: 1000
        type: constant
      - name: "P90 Total Latency under 2s"
        metric: total_latency_ms
        percentile: 0.90
        value: 4000
        type: constant

runtime:
  max_sessions: 500
  benchmark_timeout: 30000
  num_client_threads: 1
  num_dispatcher_threads: 1
  num_completion_threads: 1

trace_recorder:
  enabled: false

wandb:                                                                                                                                                                                                      
  enabled: true                                                                                                                                                                                             
  project: "sharegpt-lm-eval-test"    
  run_name: "dp_aura_2_500"                                                                                                                                                                             
  tags: ["deepgram", "aura-2"]                                                                                                                                                                            
  log_artifacts: true