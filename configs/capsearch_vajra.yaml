# Capacity search — Vajra Qwen3-TTS
# Finds the maximum QPS that still meets TTFA and total-latency SLOs.
# Uses rate-based traffic with a fixed interval generator (capsearch varies the rate).

output_dir: capacity_search_output/vajra
start_value: 0.1
max_value: 5
expansion_factor: 2.0
max_iterations: 10
precision: 2

benchmark_config:
  seed: 42
  output_dir: capacity_search_output/vajra

  client:
    type: tts
    provider: vajra
    api_base: "http://localhost:8001"
    model: qwen3-tts-240k
    sample_rate: 24000
    chunk_size: 1024
    raw_pcm: false
    save_audio: false
    request_timeout: 120

  session_generator:
    type: trace
    trace_file: traces/sharegpt_data.json
    wrap_mode: true
    flavor:
      type: sharegpt
      assistant_role: gpt
      min_tokens: 20
      max_tokens: 150

  traffic_scheduler:
    type: rate
    interval_generator:
      type: fixed   # rate is set by capsearch
    cancel_session_on_failure: false

  evaluators:
    - type: performance
      target_channels: ["audio"]
      audio_channel:
        save_audio_files: false
      stream_metrics: true
      stream_metrics_interval: 5.0
      slos:
        - name: "P99 TTFA under 1s"
          metric: ttfa
          percentile: 0.90
          value: 300
          type: constant
        - name: "P90 Total Latency under 4s"
          metric: e2e
          percentile: 0.90
          value: 35000
          type: constant

  runtime:
    max_sessions: 100
    benchmark_timeout: 120
    num_client_threads: 10
    num_dispatcher_threads: 2
    num_completion_threads: 2

  trace_recorder:
    enabled: true
    include_content: false

  wandb:
    enabled: true
    project: "sharegpt-lm-eval-test"
    tags: ["vajra", "qwen3-tts", "capsearch"]
    log_artifacts: true
