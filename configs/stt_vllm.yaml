seed: 42
output_dir: benchmark_output/stt_vllm

client:
  type: stt
  provider: vllm
  api_base: "http://localhost:8000"
  model: openai/whisper-large-v3
  language: en
  audio_format: wav
  sample_rate: 16000
  streaming: false
  request_timeout: 120

session_generator:
  type: trace
  trace_file: traces/audio_manifest.jsonl
  wrap_mode: true
  flavor:
    type: audio
    audio_dir: ""  # set if audio_file paths in manifest are relative

traffic_scheduler:
  type: concurrent
  target_concurrent_sessions: 1
  rampup_seconds: 0

evaluators:
  - type: performance
    target_channels: ["audio"]
    audio_channel:
      save_audio_files: false
    stream_metrics: true
    stream_metrics_interval: 5.0
    slos:
      - name: "P99 TTFT under 500ms"
        metric: ttft
        percentile: 0.99
        value: 500
        type: constant
      - name: "P90 Total Latency under 5s"
        metric: e2e
        percentile: 0.90
        value: 5000
        type: constant

runtime:
  max_sessions: 100
  benchmark_timeout: 30000
  num_client_threads: 1
  num_dispatcher_threads: 1
  num_completion_threads: 1

trace_recorder:
  enabled: false
