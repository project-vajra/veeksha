seed: 42
output_dir: "benchmark_output/vajra_{datetime}"

client:
  type: stt
  provider: vajra
  api_base: "http://localhost:8003"
  model: vajra-asr
  language: en
  audio_format: wav
  sample_rate: 16000
  # Streaming mode — routes through _stream_vajra in veeksha/client/stt.py,
  # which opens ws://host:port/stream and sends raw int16 PCM frames
  # followed by the text "end" sentinel.
  streaming: true
  # 2048 bytes = 1024 samples = 64 ms of audio at 16 kHz. Matches the
  # vLLM meeting config so the two engines see the same frame cadence.
  ws_chunk_size: 2048
  # Simulate live microphone: sleep chunk_duration between sends so the
  # server receives audio at 1× playback rate.
  ws_realtime_pacing: true
  # Meetings run long. Don't HTTP-timeout mid-session.
  request_timeout: 7200

session_generator:
  type: trace
  # Option C: reuse short-clip manifest with wrap_mode so each session
  # loops its clip(s) to fill the benchmark window. Not WER-accurate
  # for meetings (repeated content = unrealistic cache behavior) but
  # correctly stresses the engine's real-time capacity.
  trace_file: traces/audio_manifest_varied.jsonl
  wrap_mode: true
  flavor:
    type: audio
    audio_dir: ""

traffic_scheduler:
  type: concurrent
  # Start at 8 simultaneous meetings. Sweep via CLI --concurrency to
  # find the RTF-crosses-1.0 capacity point.
  target_concurrent_sessions: 8
  # Staggered joins — 60 s rampup spreads the initial bootstrap burst.
  rampup_seconds: 0

evaluators:
  - type: performance
    target_channels: ["audio"]
    audio_channel:
      save_audio_files: false
    stream_metrics: true
    stream_metrics_interval: 10.0
    slos:
      - name: "P99 TTFC under 500ms"
        metric: ttfc
        percentile: 0.99
        value: 500
        type: constant
      - name: "P95 RTF under 1.0"
        metric: rtf
        percentile: 0.95
        value: 1.0
        type: constant
      - name: "P90 TPOT under 300ms"
        metric: tpot
        percentile: 0.90
        value: 300
        type: constant

runtime:
  max_sessions: -1
  benchmark_timeout: 300
  post_timeout_grace_seconds: 120
  num_client_threads: 2
  num_dispatcher_threads: 2
  num_completion_threads: 2

trace_recorder:
  enabled: false
