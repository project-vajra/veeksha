# Capacity search — vllm-omni Qwen3-TTS
# Finds the maximum QPS that still meets TTFA and total-latency SLOs.
# Uses rate-based traffic with a fixed interval generator (capsearch varies the rate).

output_dir: capacity_search_output/vllm_omni
start_value: 0.05
max_value: 2
expansion_factor: 2.0
max_iterations: 10
precision: 2

benchmark_config:
  seed: 42
  output_dir: capacity_search_output/vllm_omni

  client:
    type: tts
    provider: vllm_omni
    api_base: "http://localhost:8001"
    model: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    voice_id: Vivian
    sample_rate: 24000
    chunk_size: 1024
    raw_pcm: false
    save_audio: false
    request_timeout: 300

  session_generator:
    type: trace
    trace_file: traces/sharegpt_data.json
    wrap_mode: true
    flavor:
      type: sharegpt
      assistant_role: gpt
      min_tokens: 20
      max_tokens: 150

  traffic_scheduler:
    type: rate
    interval_generator:
      type: fixed   # rate is set by capsearch
    cancel_session_on_failure: false

  evaluators:
    - type: performance
      target_channels: ["audio"]
      audio_channel:
        save_audio_files: false
      stream_metrics: true
      stream_metrics_interval: 5.0
      slos:
        - name: "P50 Total Latency under 135s"
          metric: total_latency_ms
          percentile: 0.50
          value: 135000
          type: constant

  runtime:
    max_sessions: 100
    benchmark_timeout: 120
    num_client_threads: 10
    num_dispatcher_threads: 2
    num_completion_threads: 2

  trace_recorder:
    enabled: true
    include_content: false

  wandb:
    enabled: true
    project: "sharegpt-lm-eval-test"
    tags: ["vllm-omni", "qwen3-tts", "capsearch"]
    log_artifacts: true
