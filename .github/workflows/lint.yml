name: "Run linter"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash -l {0}
jobs:
  sanity_check:
    runs-on: [self-hosted, cpu]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Build base image"
        run: docker build -t veeksha-base .
      - name: "Run lint"
        run: |
          docker run --rm \
          -v "${GITHUB_WORKSPACE}:/repo" \
          -w /repo \
          veeksha-base \
          bash -lc "make test/setup/314 && source .venv314/bin/activate && make lint"
