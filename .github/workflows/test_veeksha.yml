name: "Test Veeksha"
on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
    types: [labeled, synchronize]

permissions:
  contents: read
  checks: write
  pull-requests: write
defaults:
  run:
    shell: bash -l {0}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test_veeksha:
    if: ${{ github.event_name != 'pull_request' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ready')) }}
    runs-on: [self-hosted, cpu]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"
      - name: "Run tests"
        run: |
          docker run --rm \
          -v "${GITHUB_WORKSPACE}:/repo" \
          -w /repo \
          ghcr.io/astral-sh/uv:bookworm \
          bash -c "
            apt-get update && apt-get install -y -qq build-essential curl ca-certificates > /dev/null 2>&1 &&
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal > /dev/null 2>&1 &&
            export PATH=/root/.cargo/bin:\$PATH &&
            mkdir -p test_output &&
            uv venv --python 3.14t .venv &&
            source .venv/bin/activate &&
            uv pip install -e . --group dev &&
            pytest tests/unit tests/e2e --junitxml=test_output/veeksha-results.xml
          "
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "test_output/*-results.xml"
          comment: true
          include_passed: true
