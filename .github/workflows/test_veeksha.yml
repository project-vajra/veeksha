name: "Test Veeksha"
on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
    types: [labeled, synchronize]

permissions:
  contents: read
  checks: write
  pull-requests: write
defaults:
  run:
    shell: bash -l {0}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test_veeksha:
    if: ${{ github.event_name != 'pull_request' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ready')) }}
    runs-on: [self-hosted, cpu]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"
      - name: "Run tests"
        run: |
          docker run --rm \
          -v "${GITHUB_WORKSPACE}:/repo" \
          -w /repo \
          ghcr.io/astral-sh/uv:bookworm \
          bash -lc "rm -rf /tmp/rustup /tmp/cargo /tmp/veeksha-test-venv && export RUSTUP_HOME=/tmp/rustup CARGO_HOME=/tmp/cargo PATH=/tmp/cargo/bin:\$PATH && curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal && VENV314=/tmp/veeksha-test-venv make test"
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "test_output/*-results.xml"
          comment: true
          include_passed: true
