name: Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e .[dev]

      - name: Run lint checks
        run: make lint

      - name: Run unit tests
        run: |
          python -m pytest tests -v -m "unit" --tb=short

  functional-tests:
    name: Functional Tests
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, 4xL40]
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
      options: --shm-size=12gb --cpus=24 --gpus all

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential git

      - name: Install dependencies
        run: |
          pip install -e .[test]

      - name: Run functional tests
        run: |
          python -m pytest tests/functional -v -m "functional and not gpu" --tb=short

  gpu-tests:
    name: GPU Tests
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, 4xL40]
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
      options: --shm-size=12gb --cpus=24 --gpus all

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential git

      - name: Install dependencies
        run: |
          pip install -e .[test]

      - name: Run GPU tests
        env:
          TEST_MODEL: facebook/opt-125m
        run: |
          python -m pytest tests/functional -v -m "gpu" --tb=short