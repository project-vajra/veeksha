type: vllm
env_path: ../vllm_env
model: Qwen/Qwen3.5-35B-A3B
host: localhost
port: 0
tensor_parallel_size: 1
dtype: bfloat16
max_model_len: 8192
startup_timeout: 600
health_check_interval: 2.0
require_contiguous_gpus: true
additional_args:
  enable-prefix-caching: true
  language-model-only: true
  attention-config: '{"backend":"FLASH_ATTN","flash_attn_version":3,"disable_flashinfer_prefill":true}'
