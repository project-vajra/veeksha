# Basic benchmark configuration
seed: 42

# Where to send requests
client:
  type: openai_images
  api_base: http://localhost:8000/v1/
  model: Qwen/Qwen-Image
  tokenizer_model: Qwen/Qwen2.5-3B-Instruct
  request_timeout: 600

# Traffic pattern: 1 sessions per second
traffic_scheduler:
  type: rate
  interval_generator:
    type: fixed
    interval: 1.0  # 1 session every second  

# Session content: single-turn with random prompts
session_generator:
  type: synthetic
  session_graph:
    type: linear
    inherit_history: true
  channels:
    - type: text
      body_length_generator:
        type: uniform
        min: 128
        max: 256
  output_spec:
    image:
      num_images: 1
      size: "32x32"
      quality: hd


# Stop conditions
runtime:
  benchmark_timeout: 60     # Run for 60 seconds
  max_sessions: 5        # No limit on sessions

# Enable metrics collection
evaluators:
  - type: performance
    target_channels: ["image"]
    