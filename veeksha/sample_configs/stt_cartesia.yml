seed: 42
output_dir: benchmark_output/stt_cartesia

client:
  type: stt
  provider: cartesia
  api_base: https://api.cartesia.ai
  api_key_env: CARTESIA_API_KEY
  model: ink-2
  language: en
  sample_rate: 16000
  # 100 ms of PCM16 mono, matching Cartesia's recommended input cadence.
  ws_chunk_size: 3200
  ws_realtime_pacing: true

session_generator:
  type: trace
  trace_file: traces/asr/aa_public/manifest.jsonl
  wrap_mode: true
  flavor:
    type: audio
    audio_dir: ""

traffic_scheduler:
  type: concurrent
  target_concurrent_sessions: 1
  rampup_seconds: 0

evaluators:
  - type: performance
    target_channels: [audio]
    slos:
      - type: constant
        name: P90 spoken-word-end to first returned text under 1 second
        metric: interactivity
        percentile: 0.90
        value: 1000

runtime:
  max_sessions: 100
  benchmark_timeout: 1800
