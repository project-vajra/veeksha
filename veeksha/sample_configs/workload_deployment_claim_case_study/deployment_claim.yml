output_dir: benchmark_output/workload_deployment_claim_case_study/qwen

linear_benchmark_config: linear.qwen.managed.yml
dag_benchmark_config: dag.qwen.managed.yml
trace_metadata_path: traces/workload_deployment_claim_case_study/workload_metadata.json

rate_basis: request_rate
start_value: 1.0
max_value: 8.0
expansion_factor: 2.0
max_iterations: 12
precision: 2

guardrails:
  min_completed_requests: 150
  min_completion_ratio: 0.97
  max_error_rate: 0.02
  max_ttfc_p99_s: 3.0
  max_e2e_p95_s: 20.0
  max_tbc_p99_s: 0.15
  require_all_slos_met: false

vllm_metrics:
  enabled: true
  require_metrics: true
  scrape_timeout_s: 10.0
