    session_generator:
      type: trace
      trace_file: ${DATASET_ROOT}/asr.indic.multidomain16.v1/gramvaani/manifest.jsonl
      wrap_mode: false
      warmup_sessions: 1
      flavor:
        type: audio
        audio_dir: ""
execution:
  seed: 42
  traffic_scheduler:
    type: concurrent
    target_concurrent_sessions: 1
    rampup_seconds: 0
  evaluators:
    - type: performance
      target_channels: [audio]
      audio_channel:
        asr_text_normalizer: unicode
        asr_compute_cer: true
  runtime:
    max_sessions: -1
    benchmark_timeout: 72000
metrics:
  - id: final_corpus_wer
    role: primary
    unit: percent
    description: Corpus WER from exact edit and reference-word totals.
    requires_all_requests_successful: true
    dataset_aggregation:
      method: ratio_of_sums
      numerator: asr_final_errors
      denominator: asr_final_reference_words
      scale: 100
    benchmark_aggregation:
      method: ratio_of_sums
      numerator: asr_final_errors
      denominator: asr_final_reference_words
      scale: 100
  - id: final_corpus_cer
    role: primary
    unit: percent
    description: Unicode character error rate excluding whitespace boundaries.
    requires_all_requests_successful: true
    dataset_aggregation:
      method: ratio_of_sums
      numerator: asr_final_cer_errors
      denominator: asr_final_reference_characters
      scale: 100
    benchmark_aggregation:
      method: ratio_of_sums
      numerator: asr_final_cer_errors
      denominator: asr_final_reference_characters
      scale: 100
  - id: first_visible_transcript_ms
    role: diagnostic
    unit: ms
    description: >-
      Time from sending the first input-audio byte to receiving the first
      non-empty provider transcript event. This is a stream-start latency, not
      word-end-to-word-display interactivity.
    dataset_aggregation:
      method: distribution
      source: time_to_first_visible_text
      quantiles: [0.5, 0.9, 0.95, 0.99]
    benchmark_aggregation:
      method: pooled_distribution
      source: time_to_first_visible_text
      quantiles: [0.5, 0.9, 0.95, 0.99]
  - id: final_transcript_ms
    role: diagnostic
    unit: ms
    description: >-
      Time from the end of input-audio transmission to the provider's terminal
      transcript event.
    dataset_aggregation:
      method: distribution
      source: time_to_final_transcript
      quantiles: [0.5, 0.9, 0.95, 0.99]
    benchmark_aggregation:
      method: pooled_distribution
      source: time_to_final_transcript
      quantiles: [0.5, 0.9, 0.95, 0.99]
  - id: stream_delivery_rtf
    role: primary
    unit: ratio
    description: >-
      Time from the first transmitted input-audio byte to the terminal
      transcript event, divided by input-audio duration. WebSocket setup is
      excluded; values at or below 1.0 keep pace with realtime input.
    dataset_aggregation:
      method: distribution
      source: streaming_rtf
      quantiles: [0.5, 0.9, 0.95, 0.99]
    benchmark_aggregation:
      method: pooled_distribution
      source: streaming_rtf
      quantiles: [0.5, 0.9, 0.95, 0.99]
  - id: connection_inclusive_request_rtf
    role: diagnostic
    unit: ratio
    description: >-
      Full client request wall time divided by input-audio duration, including
      connection establishment. Retained as an operational diagnostic only.
    dataset_aggregation:
      method: distribution
      source: rtf
      quantiles: [0.5, 0.9, 0.95, 0.99]
    benchmark_aggregation:
      method: pooled_distribution
      source: rtf
      quantiles: [0.5, 0.9, 0.95, 0.99]
  - id: websocket_setup_ms
    role: diagnostic
    unit: ms
    description: WebSocket connection establishment measured separately.
    dataset_aggregation:
      method: distribution
      source: ws_connect_latency_ms
      quantiles: [0.5, 0.9, 0.95, 0.99]
    benchmark_aggregation:
      method: pooled_distribution
      source: ws_connect_latency_ms
      quantiles: [0.5, 0.9, 0.95, 0.99]
  - id: request_error_rate
    role: primary
    unit: fraction
    dataset_aggregation:
      method: ratio_of_sums
      numerator: Number of Errored Requests
      denominator: Number of Requests
    benchmark_aggregation:
      method: ratio_of_sums
      numerator: Number of Errored Requests
      denominator: Number of Requests
  - id: request_cancellation_rate
    role: primary
    unit: fraction
    dataset_aggregation:
      method: ratio_of_sums
      numerator: Number of Cancelled Requests
      denominator: Number of Requests
    benchmark_aggregation:
      method: ratio_of_sums
      numerator: Number of Cancelled Requests
      denominator: Number of Requests
