schema_version: 1
id: asr.indic.multidomain16.v1
name: Indic multilingual multidomain realtime ASR
description: >-
  Full pinned Indic ASR Eval corpus, executed as seven independent dataset
  runs under one 16 kHz realtime streaming and Unicode WER/CER contract.
modality: asr
input_mode: streaming
output_mode: streaming
interaction:
  connection_scope: per_request
  connection_setup_in_latency: false
  connection_setup_metric: ws_connect_latency_ms
  audio_encoding: pcm_s16le
  sample_rate_hz: 16000
  input_frame_ms: 20
  input_pacing: realtime
  transcript_events: provider_native_interim_and_final
  language_routing: request_metadata
  language_metadata_key: language
  required_languages:
    [bn, bho, hne, gu, hi, kn, mag, mai, ml, mr, or, pa, sa, ta, te, ur]
client_overrides:
  sample_rate: 16000
  ws_chunk_size: 640
  ws_realtime_pacing: true
  language_metadata_key: language
datasets:
  - id: kathbath
    name: Kathbath
    source:
      kind: huggingface
      uri: ayush-shunyalabs/Indic_ASR_Eval
      revision: 7c1d7dde6aee30d98075522bc9ec9eb26898f6ab
      config: kathbath
      split: test
      license: CC-BY-4.0 compilation; upstream sample terms apply
      expected_rows: 1200
    session_generator:
      type: trace
      trace_file: ${DATASET_ROOT}/asr.indic.multidomain16.v1/kathbath/manifest.jsonl
      wrap_mode: false
      warmup_sessions: 1
      flavor:
        type: audio
        audio_dir: ""
  - id: kathbath_noisy
    name: Kathbath Noisy
    source:
      kind: huggingface
      uri: ayush-shunyalabs/Indic_ASR_Eval
      revision: 7c1d7dde6aee30d98075522bc9ec9eb26898f6ab
      config: kathbath_noisy
      split: test
      license: CC-BY-4.0 compilation; upstream sample terms apply
      expected_rows: 1200
    session_generator:
      type: trace
      trace_file: ${DATASET_ROOT}/asr.indic.multidomain16.v1/kathbath_noisy/manifest.jsonl
      wrap_mode: false
      warmup_sessions: 1
      flavor:
        type: audio
        audio_dir: ""
  - id: fleurs
    name: FLEURS
    source:
      kind: huggingface
      uri: ayush-shunyalabs/Indic_ASR_Eval
      revision: 7c1d7dde6aee30d98075522bc9ec9eb26898f6ab
      config: fleurs
      split: test
      license: CC-BY-4.0 compilation; upstream sample terms apply
      expected_rows: 1100
    session_generator:
      type: trace
      trace_file: ${DATASET_ROOT}/asr.indic.multidomain16.v1/fleurs/manifest.jsonl
      wrap_mode: false
      warmup_sessions: 1
      flavor:
        type: audio
        audio_dir: ""
  - id: indictts
    name: IndicTTS
    source:
      kind: huggingface
      uri: ayush-shunyalabs/Indic_ASR_Eval
      revision: 7c1d7dde6aee30d98075522bc9ec9eb26898f6ab
      config: indictts
      split: test
      license: CC-BY-4.0 compilation; upstream sample terms apply
      expected_rows: 900
    session_generator:
      type: trace
      trace_file: ${DATASET_ROOT}/asr.indic.multidomain16.v1/indictts/manifest.jsonl
      wrap_mode: false
      warmup_sessions: 1
      flavor:
        type: audio
        audio_dir: ""
  - id: respin
    name: RESPIN
    source:
      kind: huggingface
      uri: ayush-shunyalabs/Indic_ASR_Eval
      revision: 7c1d7dde6aee30d98075522bc9ec9eb26898f6ab
      config: respin
      split: test
      license: CC-BY-4.0 compilation; upstream sample terms apply
      expected_rows: 900
    session_generator:
      type: trace
      trace_file: ${DATASET_ROOT}/asr.indic.multidomain16.v1/respin/manifest.jsonl
      wrap_mode: false
      warmup_sessions: 1
      flavor:
        type: audio
        audio_dir: ""
  - id: commonvoice
    name: Common Voice
    source:
      kind: huggingface
      uri: ayush-shunyalabs/Indic_ASR_Eval
      revision: 7c1d7dde6aee30d98075522bc9ec9eb26898f6ab
      config: commonvoice
