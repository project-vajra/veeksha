timeout: 10000
max_completed_requests: 5
seed: 42

endpoint:
  api_url: http://localhost:30000/v1
  api_key: token-abc123

client_config:
  model: meta-llama/Meta-Llama-3-8B-Instruct
  num_clients: 15
  num_concurrent_requests_per_client: 10
  llm_api: openai_chat
    
request_generator_config:
  type: synthetic
  interval_generator_config:
    type: gamma
  length_generator_config:
    type: uniform

metrics_config:
  deadline_report:
    ttft_deadline: 0.6
    tbt_deadline: 0.04
    target_deadline_miss_rate: 0.1
