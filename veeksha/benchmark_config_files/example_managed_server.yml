timeout: 10000
max_completed_requests: 5
seed: 42

client_config:
  llm_api: openai_chat

server_config:
  engine: sglang
  model: meta-llama/Meta-Llama-3-8B-Instruct
  environment_path: sglang_env
  port: 30000
  host: localhost
  api_key: token-abc123
  additional_args: >-
    {"chunked-prefill-size": 256,
    "piecewise-cuda-graph-tokens": [2, 4, 8, 16],
    "skip-server-warmup": true,
    "device": "cuda"}

request_generator_config:
  type: synthetic
  interval_generator_config:
    type: gamma
  length_generator_config:
    type: uniform

metrics_config:
  deadline_report:
    ttft_deadline: 0.6
    tbt_deadline: 0.04
    target_deadline_miss_rate: 0.1