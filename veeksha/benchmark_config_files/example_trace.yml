timeout: 10000
max_completed_requests: 5
api_url: http://localhost:30001/v1
api_key: token-abc123

client_config:
  model: meta-llama/Meta-Llama-3-8B-Instruct
  num_clients: 15
  num_concurrent_requests_per_client: 10
  llm_api: openai_chat

request_generator_config:
  type: synthetic
  length_generator_config:
    type: trace
    trace_file: data/processed_traces/short_trace.jsonl
    exhaustion_policy: stop
    input_length_column: input_length
    output_length_column: output_length
  interval_generator_config:
    type: poisson
