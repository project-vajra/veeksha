timeout: 10000
max_completed_requests: 5

client_config:
  endpoint:
    api_url: http://localhost:30000/v1
    api_key: token-abc123
  model: meta-llama/Meta-Llama-3-8B-Instruct
  num_clients: 15
  num_concurrent_requests_per_client: 10
  llm_api: openai_chat

request_generator_config:
  type: trace # use default trace: swe_agent
  input_length_column: input_length
  output_length_column: output_length
  use_trace_prefix_hash_ids: true
