timeout: 10000
max_completed_requests: 5
api_url: "http://localhost:30000/v1"
api_key: "token-abc123"

client_config:
  - model: "meta-llama/Meta-Llama-3-8B-Instruct"
    num_clients: 15
    num_concurrent_requests_per_client: 10
    llm_api: "openai_chat"
    
request_generator_config:
  - type: "trace"
    trace_file: "data/processed_traces/swe_agent_trace_short.jsonl"
    use_prefix_hash_ids: true
    session_generator_config:
      type: "trace_synthetic"
      session_interval_generator_config:
        type: "poisson"
      minimum_prefix_match: 0.25
      min_session_size: 1
      max_session_size: 10
      max_request_interval: 1.0