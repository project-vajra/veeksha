output_dir: capsearch_results
max_iterations: 5
# Create a new server for each QPS run instead of reusing one server for all runs
server_per_qps_run: false
slos:
  - type: constant
    metric: ttft
    value: 5
    percentile: 0.5
    name: P50 TTFT
  - type: constant
    metric: tbt
    value: 0.05
    percentile: 0.9
    name: P90 TBT

benchmark_config:
  timeout: 10000
  max_completed_requests: 5
  # api_url and api_key will be auto-populated from server_config if provided
  # api_url: http://localhost:30000/v1
  # api_key: token-abc123

  # Optional: Enable automatic server management
  server_config:
    engine: vllm
    port: 30000
    tensor_parallel_size: 1

  client_config:
    model: meta-llama/Meta-Llama-3-8B-Instruct
    llm_api: openai_chat

  request_generator_config:
    type: trace
    input_length_column: input_length
    output_length_column: output_length
    use_trace_prefix_hash_ids: true
    session_generator_config:
      minimum_prefix_match: 0.8
      max_session_size: 100
      min_session_size: 5
      save_as_trace_file: true
