output_dir: capsearch_results
max_iterations: 5

# restart the server at the start of each iteration
restart_server_per_iteration: true

slos:
  - type: constant
    metric: ttft
    value: 5
    percentile: 0.5
    name: P50 TTFT
  - type: constant
    metric: tbt
    value: 0.05
    percentile: 0.9
    name: P90 TBT

benchmark_config:
  timeout: 10000
  max_completed_requests: 5
  seed: 42

  # optional
  server_config:
    engine: sglang
    model: meta-llama/Meta-Llama-3-8B-Instruct
    environment_path: sglang_env
    port: 30000
    host: localhost
    api_key: token-abc123
    additional_args: >-
      {"chunked-prefill-size": 256,
      "piecewise-cuda-graph-tokens": [2, 4, 8, 16],
      "skip-server-warmup": true,
      "device": "cuda"}

  client_config:
    llm_api: openai_chat

  request_generator_config:
    type: trace
    input_length_column: input_length
    output_length_column: output_length
    use_trace_prefix_hash_ids: true
    session_generator_config:
      minimum_prefix_match: 0.8
      max_session_size: 100
      min_session_size: 5
      save_as_trace_file: true
