# Example composable SLO configuration for production use
# This demonstrates how to define multiple SLOs with different types and percentiles.
# All SLOs under this section must be met for the run to be considered successful.
require_all: true
slos:
  # Dynamic TTFT based on predictions with an offset (slack).
  - type: "prediction_offset"
    metric: "ttft"
    value: 0.2 # 200ms slack added to prediction
    percentile: 0.9
    name: "P90 Dynamic TTFT"

  # Constant TBT threshold.
  - type: "constant"
    metric: "tbt"
    value: 0.03 # 30ms
    percentile: 0.95
    name: "P95 TBT"

  # TPOT constraint.
  - type: "constant"
    metric: "tpot"
    value: 0.05 # 50ms per token
    percentile: 0.9
    name: "P90 TPOT"

  # Deadline miss rate.
  - type: "constant"
    metric: "deadline_miss_rate"
    value: 0.1 # 10% miss rate allowed
    percentile: 0.99
    name: "P99 Deadline miss rate"

---
# Alternative configuration: Any SLO can be met.
# This is useful for defining different tiers of service.
require_all: false
slos:
  # Fast tier: Very low TTFT.
  - type: "constant"
    metric: "ttft"
    value: 0.1 # 100ms
    percentile: 0.9
    name: "Fast tier TTFT"

  # Economy tier: Low deadline miss rate.
  - type: "constant"
    metric: "deadline_miss_rate"
    value: 0.05 # 5% miss rate
    percentile: 0.99
    name: "Economy tier deadline"

---
# Proportional SLO example: TTFT must be within 1.5x of prediction.
# This uses a prediction multiplier and includes clamping.
require_all: true
slos:
  - type: "prediction_multiplier"
    metric: "ttft"
    value: 1.5 # 1.5x the predicted time
    percentile: 0.95
    min_value: 0.1 # At least 100ms
    max_value: 2.0 # At most 2s
    name: "TTFT within 1.5x prediction" 