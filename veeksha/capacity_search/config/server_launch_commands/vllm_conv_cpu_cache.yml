# SGLang Server Configuration
module: "vllm serve"
port: 8001
model: "meta-llama/Meta-Llama-3-8B-Instruct"
dtype: "auto"
tensor_parallel_size: 1
enable_cache_telemetry: true
cache_telemetry_output_dir: "../veeksha/cache_telemetry_output/tp1/vllm_cpu_cache_conv"
reset_cache_telemetry_on_new_file: true
max_model_len: 128000
max_num_seqs: 256
enable_chunked_prefill: true
max_num_batched_tokens: 512
enable_prefix_caching: true
gpu_memory_utilization: 0.8
block_size: 16
# hf_overrides: {'rope_scaling': {'type': 'linear', 'factor': 16.0}, 'rope_theta': 8000000}
readiness_timeout: 600
kv-transfer-config: '{"kv_connector":"LMCacheConnectorV1", "kv_role":"kv_both"}'
error_patterns:
  - "CUDA out of memory"
  - "NCCL error"
  - "socket.error: [Errno 98] Address already in use"
environment_variables:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  LMCACHE_USE_EXPERIMENTAL: true
  # 256 Tokens per KV Chunk
  LMCACHE_CHUNK_SIZE: 256
  # Enable CPU memory backend
  LMCACHE_LOCAL_CPU: true # default
  # 5GB of Pinned CPU memory
  LMCACHE_MAX_LOCAL_CPU_SIZE: 5
