seed: 42

traffic_scheduler:
  type: concurrent
  target_concurrent_sessions: 100
  rampup_seconds: 20 # reach 10 concurrent sessions in 5 seconds
  # interval_generator:
  #   type: fixed
  #   interval: 1
  # cancel_session_on_failure: False

session_generator:
  type: synthetic
  session_graph:
    type: linear
    num_request_generator:
      type: uniform
      min: 2
      max: 10
    request_wait_generator:
      type: poisson
      arrival_rate: 1.5
    inherit_history: True
  channels:
    - type: text
      body_length_generator:
        type: uniform
        min: 10
        max: 200
      output_length_generator:
        type: uniform
        min: 10
        max: 200

client:
  type: openai_chat
  model: meta-llama/Meta-Llama-3-8B-Instruct
  request_timeout: 120
  api_base: http://localhost:30002/v1
  max_tokens_param: max_completion_tokens
  min_tokens_param: min_tokens
  use_min_tokens_prompt_fallback: False

runtime:
  max_sessions: -1
  benchmark_timeout: 300
  num_dispatcher_threads: 10
  num_completion_threads: 10
  num_client_threads: 300

trace_recorder:
  enabled: True
  include_content: True