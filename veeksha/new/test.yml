seed: 42

traffic_scheduler:
  type: concurrent
  target_concurrent_sessions: 2
  cancel_session_on_failure: False

session_generator:
  type: synthetic
  session_graph:
    type: linear
    num_request_generator:
      type: fixed
      length: 3
    request_wait_generator:
      type: fixed
      interval: 0.5
    inherit_history: True
  channels:
    - type: text
      body_length_generator:
        type: fixed
        length: 10
      output_length_generator:
        type: uniform
        min_length: 10
        max_length: 20

client:
  type: openai_chat
  model: meta-llama/Meta-Llama-3-8B-Instruct
  request_timeout: 120
  api_base: http://localhost:30002/v1
  max_tokens_param: max_completion_tokens
  min_tokens_param: min_tokens
  use_min_tokens_prompt_fallback: False

runtime:
  max_sessions: 3
  benchmark_timeout: 120