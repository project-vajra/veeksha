seed: 42

traffic_scheduler:
  type: rate
  interval_generator:
    type: poisson
    arrival_rate: 10
  cancel_session_on_failure: False

session_generator:
  type: synthetic
  session_graph:
    type: linear
    num_request_generator:
      type: uniform
      min: 2
      max: 10
    request_wait_generator:
      type: poisson
      arrival_rate: 5
    inherit_history: True
  channels:
    - type: text
      body_length_generator:
        type: uniform
        min: 20
        max: 300
      output_length_generator:
        type: uniform
        min: 100
        max: 500

client:
  type: openai_chat
  model: meta-llama/Meta-Llama-3-8B-Instruct
  request_timeout: 60
  api_base: http://localhost:30002/v1
  max_tokens_param: max_completion_tokens
  min_tokens_param: min_tokens
  use_min_tokens_prompt_fallback: False

runtime:
  max_sessions: -1
  benchmark_timeout: 300
  num_dispatcher_threads: 5
  num_completion_threads: 5
  num_client_threads: 5

trace_recorder:
  enabled: True
  include_content: True
