seed: 42

traffic_scheduler:
  type: concurrent
  cancel_session_on_failure: False

session_generator:
  type: synthetic
  session_graph:
    type: linear
    num_request_generator:
      type: uniform
      min_length: 2
      max_length: 4
    request_wait_generator:
      type: poisson
      arrival_rate: 0.5
  channels:
    - type: text
      length_generator:
        type: zipf
        max_length: 20
        min_length: 1

client:
  type: openai_chat
  api_base: http://localhost:65535/v1

runtime:
  max_sessions: 5