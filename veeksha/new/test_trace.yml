seed: 42

traffic_scheduler:
  type: concurrent
  target_concurrent_sessions: 32
  rampup_seconds: 32
  # type: rate
  # interval_generator:
  #   type: poisson
  #   arrival_rate: 0.5

session_generator:
  type: trace
  trace_file: traces/loogle/loogle_trace-wikipedia.jsonl
  flavor:
    type: rag
    num_documents: 32

client:
  type: openai_chat
  model: meta-llama/Meta-Llama-3-8B-Instruct
  request_timeout: 120
  api_base: http://localhost:30002/v1
  max_tokens_param: max_completion_tokens
  min_tokens_param: min_tokens

runtime:
  max_sessions: -1
  benchmark_timeout: 300
  num_dispatcher_threads: 5
  num_completion_threads: 5
  num_client_threads: 5

trace_recorder:
  enabled: True
  include_content: False

output_dir: benchmark_outputs/loogle
