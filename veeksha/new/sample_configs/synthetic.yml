seed: 42

traffic_scheduler:
  type: rate
  interval_generator:
    type: poisson
    arrival_rate: 10
  cancel_session_on_failure: False

session_generator:
  type: synthetic
  session_graph:
    type: linear
    num_request_generator:
      type: uniform
      min: 2
      max: 4
    request_wait_generator:
      type: poisson
      arrival_rate: 5
    inherit_history: True
  channels:
    - type: text
      shared_prefix_ratio: 0.2
      shared_prefix_probability: 0.5 # 50% of root requests have 20% shared prefix
      body_length_generator:
        type: uniform
        min: 20
        max: 30
      output_length_generator:
        type: uniform
        min: 100
        max: 500

evaluator:
  type: performance
  slos:
    - type: constant
      metric: ttfc
      percentile: 0.99
      value: 0.5
      name: P99 TTFC
    - type: constant
      metric: tbc
      percentile: 0.9
      value: 0.05
      name: P90 TBC

client:
  type: openai_chat
  model: meta-llama/Llama-3.2-1B-Instruct
  request_timeout: 60
  api_base: http://localhost:30002/v1
  max_tokens_param: max_completion_tokens
  min_tokens_param: min_tokens
  use_min_tokens_prompt_fallback: False

runtime:
  max_sessions: 10
  benchmark_timeout: 60

trace_recorder:
  enabled: True
  include_content: True
